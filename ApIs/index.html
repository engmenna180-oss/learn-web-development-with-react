<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew & Sip - Beverage Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">☕ Brew & Sip</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li>
        <button id="cartBtn" class="cart-icon-btn">
          🛒 <span id="cartBadge" class="cart-badge">0</span>
        </button>
      </li>
      <li><button id="themeToggle" class="theme-icon-btn">🌙</button></li>
      <li id="userNavContainer"></li>
    </ul>
  </nav>
  <header class="hero">
    <h1>Freshly Brewed Happiness</h1>
    <p>Explore our premium coffees, teas, and cold beverages</p>
  </header>
  <main class="main-container">
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search your favorite drink...">
    </div>
    <section id="productsContainer" class="products-grid">
    </section>
  </main>
  <div id="modalOverlay" class="modal-overlay">
    <div class="cart-modal">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="closeModal" class="close-btn">&times;</button>
      </div>
      <ul id="cartItemsList" class="cart-items-list">
      </ul>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button id="checkoutBtn" class="btn">Checkout (Cash on Delivery)</button>
      </div>
    </div>
  </div>
  <footer>
    <p>&copy; 2026 Menna. All rights reserved.</p>
  </footer>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
