<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menna_From</title>
</head>
<body>

    <form border="2" style="width: 100%; border: 0px solid #fdf9f9; background-color: #e3e6e7; " >
        <div style=" border: 2px solid #aea9a9; padding: 20px;">
        <h2>Your basic info</h2>
        <label for="name">Name</label><br>
        <input style="width:95%; height: 20px;" type="text" name="name" required><br><br>

        <label for="email">Email</label><br>
        <input style="width:95%; height: 20px;" type="email" name="email" required><br><br>

        <label for="password">Password</label><br>
        <input style="width:95%; height: 20px;" type="password" name="password" minlength="8" required><br><br>

        <label>Age:</label><br>
        <input type="radio" name="age" value="under 16" required>
        <label for="under16">Under 16</label><br>
        <input type="radio" name="age" value="16 or Older" required>
        <label for="over16">16 or Older</label><br><br>

        <h2>Your profile</h2>
        <label for="biography">Biography</label><br>
        <input style="width:95%; height: 30px;" name="biography" minlength="10" maxlength="100" required><br><br>

        <label for="courses">Select Courses</label><br>
        <select style="width:96%; height: 20px;" name="courses" required>
            <option value="cs">Computer Science Engineering</option>
            <option value="is">Information Systems</option>
            <option value="ai">Information Technology</option>
        </select><br><br>

        <label>Interests:</label><br>
        <input type="checkbox" name="interests" value="engineering">
        <label for="engineering">Engineering</label><br>
        <input type="checkbox"  name="interests" value="business">
        <label for="business">Business</label><br>
        <input type="checkbox"  name="interests" value="law">
        <label for="law">Law</label><br><br>
        
        <button style="width: 100%; height: 35px; background-color: rgb(55, 158, 214);" type="submit" >SUBMIT</button>
        </div>
    </form>

</body>
</html>
